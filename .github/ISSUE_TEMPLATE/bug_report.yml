name: Bug report
description: Report a reproducible software defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not upload patient-identifiable, confidential, or unapproved research data. Use synthetic or appropriately de-identified examples."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code snippet or synthetic input that reproduces the issue.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MorphoQuant version or commit
      placeholder: "0.1.0 or a Git commit SHA"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Operating system and dependency versions
    validations:
      required: true
